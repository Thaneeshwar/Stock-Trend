[theme]
primaryColor = "#22d3ee"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e1b4b"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = true

[runner]
magicEnabled = false

[logger]
level = "info"
